<section id="skills" class="section-pad">
  <div class="container">

    <div class="section-header text-center mb-5">
      <span class="section-badge">What I Know</span>
      <h2 class="section-title">Technical Skills</h2>
      <p class="section-subtitle">Technologies and tools I work with daily to build enterprise solutions</p>
    </div>

    <!-- Category Filter -->
    <div class="d-flex flex-wrap justify-content-center gap-2 mb-5">
      <button
        class="btn filter-btn rounded-pill"
        [class.active]="activeCategory() === 'All'"
        (click)="activeCategory.set('All')"
      >All</button>

      @for (cat of data.skillCategories; track cat) {
        <button
          class="btn filter-btn rounded-pill"
          [class.active]="activeCategory() === cat"
          (click)="activeCategory.set(cat)"
        >{{ cat }}</button>
      }
    </div>

    <!-- Skills Grid -->
    <div class="row g-3">
      @for (skill of filteredSkills(); track skill.name) {
        <div class="col-6 col-sm-4 col-md-3 col-lg-2">
          <div class="skill-card text-center h-100">

            @if (skill.imgUrl) {
              <img
                [src]="skill.imgUrl"
                [alt]="skill.name"
                class="skill-img mb-2"
                (error)="onImgErr($event, skill)"
              />
            } @else {
              <i class="bi skill-icon mb-2" [class]="skill.icon"></i>
            }

            <div class="skill-name">{{ skill.name }}</div>
            <div class="skill-cat-badge">{{ skill.category }}</div>
          </div>
        </div>
      }
    </div>

  </div>
</section>
